name: three-high-miniapp

services:
  mysql:
    image: ${DOCKER_BASE_REGISTRY:-docker.io/library}/mysql:8.4
    container_name: three-high-mysql
    environment:
      MYSQL_DATABASE: three_high_health
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_USER: ${MYSQL_USER:-three_high_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend-preview:
    profiles: ["legacy-preview"]
    build:
      context: ./frontend/preview
      dockerfile: Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: three-high-miniapp-preview
    ports:
      - "8088:80"
    restart: unless-stopped

  redis:
    image: ${DOCKER_BASE_REGISTRY:-docker.io/library}/redis:7-alpine
    container_name: three-high-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_REGISTRY: ${DOCKER_BASE_REGISTRY:-docker.io/library}
    container_name: three-high-backend-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/three_high_health}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      RATELIMIT_DEFAULT: ${RATELIMIT_DEFAULT:-1000 per minute}
      WECHAT_LOGIN_RATE_LIMIT: ${WECHAT_LOGIN_RATE_LIMIT:-120 per minute}
      ADMIN_LOGIN_RATE_LIMIT: ${ADMIN_LOGIN_RATE_LIMIT:-60 per minute}
      TOKEN_MAX_AGE_SECONDS: ${TOKEN_MAX_AGE_SECONDS:-604800}
      TOKEN_VERSION_REQUIRED: ${TOKEN_VERSION_REQUIRED:-false}
      WECHAT_LOGIN_MODE: ${WECHAT_LOGIN_MODE:-mock}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_MOCK_OPENID: ${WECHAT_MOCK_OPENID:-demo-openid}
      WECHAT_API_TIMEOUT_SECONDS: ${WECHAT_API_TIMEOUT_SECONDS:-5}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-2026-08-23}
      USER_AGREEMENT_VERSION: ${USER_AGREEMENT_VERSION:-2026-08-23}
      HEALTH_DATA_CONSENT_VERSION: ${HEALTH_DATA_CONSENT_VERSION:-2026-08-23}
      HEALTH_CONSENT_REQUIRED: ${HEALTH_CONSENT_REQUIRED:-true}
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT:-0}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      UPLOAD_FOLDER: /app/storage/uploads
      MAX_UPLOAD_BYTES: 10485760
      AUTH_REQUIRED: "true"
      AUTO_CREATE_TABLES: "false"
      DOMAIN_REPOSITORIES_ENABLED: "true"
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/storage/uploads
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  uploads-data:
